[project]
name = "cda-eval"
version = "0.1.0"
description = "Evals for the Code Documentation Assistant: retrieval recall, answer faithfulness and refusals against a golden set."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
cda-eval = "cda_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cda_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs the API running with the golden repository ingested"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
